{% load export_tags %}
{% comment %}
Export buttons for list pages. Keeps the current filters (querystring).
PDF opens in a new tab (viewable/printable); Excel downloads.
{% endcomment %}
<div class="flex items-center gap-2">
    <a href="{% export_url 'pdf' %}" target="_blank" title="Voir / imprimer en PDF"
       class="inline-flex items-center px-3 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg hover:bg-red-200 dark:hover:bg-red-900/50 transition text-sm font-medium">
        <i class="fas fa-file-pdf mr-1.5"></i>PDF
    </a>
    <a href="{% export_url 'xlsx' %}" title="Télécharger en Excel"
       class="inline-flex items-center px-3 py-2 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-lg hover:bg-green-200 dark:hover:bg-green-900/50 transition text-sm font-medium">
        <i class="fas fa-file-excel mr-1.5"></i>Excel
    </a>
</div>
