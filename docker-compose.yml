version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: stock_control_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: stockcontrol123
      MYSQL_DATABASE: stock_control_pos
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pstockcontrol123"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
